services:
  cleanarchitecturetemplate.web:
    image: ${DOCKER_REGISTRY-}cleanarchitecturetemplateweb
    build:
      context: .
      dockerfile: solution/CleanArchitectureTemplate.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    # Values come from `.env` (copy `.env.example` and fill it in).
    environment:
      ConnectionStrings__DefaultConnection: ${DOCKER_SQLSERVER_CONNECTION_STRING:?Set DOCKER_SQLSERVER_CONNECTION_STRING in .env}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8080"
      DataProtection__ApplicationName: ${DataProtection__ApplicationName:?Set DataProtection__ApplicationName in .env}
    ports:
      - "8080:8080"
    volumes:
      # Persists Data Protection keys so auth cookies survive container rebuilds.
      - dataprotection_keys:/app/DataProtection-Keys

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cleanarchitecturetemplate-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver_data:
  dataprotection_keys:
